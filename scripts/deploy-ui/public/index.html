<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Deploy SecondServe</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <h1>Déploiement SecondServe</h1>

  <section id="config-section">
    <h2>Configuration</h2>
    <form id="config-form">
      <label>VPS_HOST <input type="text" name="VPS_HOST" /></label>
      <label>VPS_USER <input type="text" name="VPS_USER" /></label>
      <label>VPS_SSH_PORT <input type="text" name="VPS_SSH_PORT" /></label>
      <label>VPS_REPO_PATH <input type="text" name="VPS_REPO_PATH" /></label>
      <label>PHONE_IP <input type="text" name="PHONE_IP" /></label>
      <label>WATCH_IP <input type="text" name="WATCH_IP" /></label>
      <button type="submit">Enregistrer</button>
    </form>
    <p id="config-status"></p>
  </section>

  <section id="deploy-section">
    <h2>Lancer un déploiement</h2>
    <form id="deploy-form">
      <label><input type="checkbox" name="phone" checked /> Phone</label>
      <label><input type="checkbox" name="watch" checked /> Watch</label>
      <label><input type="checkbox" name="release" id="release-toggle" /> Release</label>
      <div id="release-fields" hidden>
        <label>Mot de passe keystore <input type="password" name="keystorePassword" /></label>
        <label>Mot de passe clé <input type="password" name="keyPassword" /></label>
      </div>
      <button type="submit" id="deploy-button">Lancer</button>
    </form>

    <div id="awaiting-input-box" hidden>
      <label id="awaiting-input-label"></label>
      <input type="text" id="awaiting-input-value" />
      <button type="button" id="awaiting-input-submit">Envoyer</button>
    </div>

    <pre id="log-panel"></pre>
  </section>

  <script src="/app.js"></script>
</body>
</html>
