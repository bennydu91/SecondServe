name: CI — Android

on:
  push:
    branches: [master, main]
    paths: ['android/**']
  pull_request:
    branches: [master, main]
    paths: ['android/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1 : Compilation + tests JVM ─────────────────────────────────────────
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Build (tous les modules Android + JVM)
        working-directory: android
        run: ./gradlew build --no-daemon

      - name: Tests unitaires :domain (JVM pur, sans device)
        working-directory: android
        run: ./gradlew :domain:test --no-daemon

      - name: Upload rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: 'android/**/build/reports/tests/'
          retention-days: 7

  # ─── Job 2 : Tests instrumentés sur émulateur ────────────────────────────────
  # Sur push master uniquement — l'émulateur prend ~10 min
  instrumented-tests:
    name: Instrumented Tests (API 35)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-${{ runner.os }}

      - name: Create AVD (si pas en cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD créé et mis en cache"

      - name: Lancer les tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd android && ./gradlew :app:connectedAndroidTest --no-daemon

      - name: Upload rapports tests instrumentés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: 'android/**/build/reports/androidTests/'
          retention-days: 7
